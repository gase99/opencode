name: Feature request
description: Suggest an idea or improvement for ConfigHub
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas are welcome. Please check the Source Policy first — requests to add
        sources that violate it (private groups, paywalled content, sources prohibiting
        automated access) will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead? Keep privacy-respecting defaults in mind.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Source fetching (Source Registry)
        - Parsing / validation
        - Health checks & scoring
        - Ranking / operator profiles
        - UI (Home / Details / Settings)
        - VPN / connection engine
        - Privacy / security
        - Documentation
        - Other
    validations:
      required: true
