name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signing material is provided ONLY via repository secrets by the human owner.
      # Required secrets (optional — without them the release APK/AAB stays unsigned):
      #   ANDROID_KEYSTORE_B64       base64-encoded release keystore
      #   ANDROID_KEYSTORE_PASSWORD  keystore password
      #   ANDROID_KEY_ALIAS          key alias
      #   ANDROID_KEY_PASSWORD       key password
      - name: Decode signing keystore (if provided)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/confighub-release.keystore"
            {
              echo "CONFIGHUB_KEYSTORE_PATH=$RUNNER_TEMP/confighub-release.keystore"
              echo "CONFIGHUB_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "CONFIGHUB_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "CONFIGHUB_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
              echo "SIGN_SUFFIX=signed"
            } >> "$GITHUB_ENV"
            echo "Release will be signed with the provided keystore."
          else
            echo "SIGN_SUFFIX=unsigned" >> "$GITHUB_ENV"
            echo "No keystore secret found — artifacts will be UNSIGNED."
          fi

      - name: Build debug & release artifacts
        run: ./gradlew --stacktrace assembleDebug assembleRelease bundleRelease

      - name: Collect release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(git describe --tags --always 2>/dev/null || echo snapshot)"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ConfigHub-${VERSION}-debug.apk"
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/app-release*.apk "dist/ConfigHub-${VERSION}-release-${SIGN_SUFFIX}.apk"
          fi
          if compgen -G "app/build/outputs/bundle/release/*.aab" > /dev/null; then
            cp app/build/outputs/bundle/release/app-release.aab "dist/ConfigHub-${VERSION}-release-${SIGN_SUFFIX}.aab"
          fi
          ls -la dist

      - name: Upload artifacts (workflow runs without tags)
        uses: actions/upload-artifact@v4
        with:
          name: confighub-release-artifacts-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "ConfigHub ${{ github.ref_name }}" \
            --generate-notes \
            dist/*
